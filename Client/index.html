<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Quiz-App/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizMaster Pro</title>
    <meta name="description" content="Modern interactive quiz platform — test your knowledge across Java, Python, C++, JavaScript, and SQL." />
    <!-- SPA routing restore: pairs with public/404.html -->
    <script>
      (function () {
        var p = window.location.search.match(/[?&]p=([^&]*)/);
        var q = window.location.search.match(/[?&]q=([^&]*)/);
        var h = window.location.search.match(/[?&]h=([^&]*)/);
        if (p) {
          var url =
            window.location.pathname.replace(/\/$/, '') +
            '/' + decodeURIComponent(p[1]) +
            (q ? '?' + decodeURIComponent(q[1]) : '') +
            (h ? '#' + decodeURIComponent(h[1]) : '');
          window.history.replaceState(null, null, url);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
