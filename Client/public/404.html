<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quiz App</title>
    <!--
      GitHub Pages SPA redirect trick.
      When a user navigates directly to a subroute (e.g. /Quiz-App/live/QUIZ-ABC123),
      GitHub Pages returns this 404.html instead of a real 404.
      We store the full URL in sessionStorage and redirect to the root,
      where index.html restores it via the companion script below.
    -->
    <script>
      var seg = 1; // number of path segments to preserve for the base (/Quiz-App = 1)
      var l = window.location;
      var path = l.pathname
        .slice(1)
        .split('/')
        .slice(seg)
        .join('/');
      var query = l.search.slice(1);
      var hash = l.hash.slice(1);
      var redirect =
        l.protocol +
        '//' +
        l.hostname +
        (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + seg).join('/') +
        '/?p=/' + encodeURIComponent(path) +
        (query ? '&q=' + encodeURIComponent(query) : '') +
        (hash ? '&h=' + encodeURIComponent(hash) : '');
      l.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
